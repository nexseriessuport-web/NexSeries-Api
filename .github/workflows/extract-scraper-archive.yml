name: Extract scraper archive

on:
  push:
    branches: [main]
    paths:
      - "anikoto-animekai-api-updated.zip"
      - ".github/workflows/extract-scraper-archive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP into a dedicated folder
        run: |
          set -euo pipefail
          mkdir -p extracted-anikoto-animekai
          unzip -o anikoto-animekai-api-updated.zip -d extracted-anikoto-animekai
          find extracted-anikoto-animekai -type f -print

      - name: Commit extracted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted-anikoto-animekai
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract Anikoto and AnimeKai scraper archive"
            git push
          fi
